name: Windows validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: Tests (${{ matrix.os }}, ${{ matrix.shell }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse scripts and run local suites
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Recurse -File -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens = $null; $errors = $null
            $null = [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if (@($errors).Count) { throw ($errors | Out-String) }
          }
          & ./tests/Test-ICloudFolders.ps1
          & ./tests/Test-ExplorerLauncher.ps1
          & ./tests/Test-Diagnostics.ps1
          & ./tests/Test-SetupUI.ps1
  integration:
    name: Isolated real writes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise real writes, ACL denial and interrupted recovery
        shell: powershell
        run: ./tests/Invoke-SandboxIntegration.ps1
      - name: Evaluate Windows Known Folder API and exact restoration
        if: always()
        shell: powershell
        run: ./tests/Test-KnownFolderApi.ps1
      - name: Retain isolated test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-${{ matrix.os }}
          path: ${{ runner.temp }}/ICloudIntegrationResults
          if-no-files-found: warn
          retention-days: 14
  package:
    name: Package verification
    needs: [unit, integration]
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify immutable source package
        shell: powershell
        run: |
          $package = ./tools/New-ReleasePackage.ps1
          ./tools/Test-ReleasePackage.ps1 -Archive $package.Archive
          ./tests/Test-ReleaseTools.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-package
          path: |
            .local/packages/v*/*.zip
            .local/packages/v*/SHA256SUMS.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
