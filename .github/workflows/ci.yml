name: Windows validation
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      arm64_rust_only:
        description: Run only the native Windows ARM64 Rust checks
        type: boolean
        required: false
        default: false
      rust_preview_x64_only:
        description: Run only the x64 Rust preview package checks
        type: boolean
        required: false
        default: false
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.arm64_rust_only != true && inputs.rust_preview_x64_only != true) }}
    name: Tests (${{ matrix.os }}, ${{ matrix.shell }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse scripts and run local suites
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Recurse -File -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens = $null; $errors = $null
            $null = [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if (@($errors).Count) { throw ($errors | Out-String) }
          }
          & ./tests/Test-ICloudFolders.ps1
          & ./tests/Test-ExplorerLauncher.ps1
          & ./tests/Test-Diagnostics.ps1
          & ./tests/Test-RoundTripState.ps1
          & ./tests/Test-SetupOutputBounds.ps1
          & ./tests/Test-FolderDefinitionResource.ps1
          & ./tests/Test-HiddenDesktop.ps1
          & ./tests/Test-ContrastQuery.ps1
          & ./tests/Test-SetupUI.ps1
          & ./tests/Test-WinUIBridgeCopyPage.ps1
          & ./tests/Test-InstallerIntegrity.ps1
          & ./tests/Test-ReleaseInputs.ps1
          & ./tests/Test-FolderCopy.ps1
          & ./tests/Test-UserExperience.ps1
  integration:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.arm64_rust_only != true && inputs.rust_preview_x64_only != true) }}
    name: Isolated real writes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise real writes, ACL denial and interrupted recovery
        shell: powershell
        run: ./tests/Invoke-SandboxIntegration.ps1
      - name: Evaluate Windows Known Folder API and exact restoration
        if: always()
        shell: powershell
        run: ./tests/Test-KnownFolderApi.ps1
      - name: Retain isolated test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-${{ matrix.os }}
          path: ${{ runner.temp }}/ICloudIntegrationResults
          if-no-files-found: warn
          retention-days: 14
  native-backend:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.arm64_rust_only != true && inputs.rust_preview_x64_only != true) }}
    name: Rust backend and UI integration
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify hosted isolation and build locked Rust snapshot
        id: native_build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $isolation = ./tests/Assert-IsolatedEnvironment.ps1
          if ($isolation -ne 'GitHubHosted') { throw 'Expected a GitHub-hosted Windows runner.' }
          rustc --version
          $build = ./tools/Build-NativeBackend.ps1 -Test
          $environment = "ICLOUD_BACKEND_WORKER=$($build.WorkerPath)`nICLOUD_BACKEND_SNAPSHOT=$($build.Snapshot)`n"
          [IO.File]::AppendAllText($env:GITHUB_ENV, $environment, (New-Object Text.UTF8Encoding($false)))
      - name: Verify native copy-plan parity
        shell: powershell
        run: ./tests/Test-NativeCopyPlan.ps1 -WorkerPath $env:ICLOUD_BACKEND_WORKER
      - name: Verify guarded native registry parity
        id: native_registry
        shell: powershell
        run: ./tests/Test-NativeBackend.ps1 -WorkerPath $env:ICLOUD_BACKEND_WORKER
      - name: Ensure redacted backend failure label exists
        if: always() && steps.native_registry.outcome == 'failure'
        shell: powershell
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'ICloudNativeBackendAssertion.txt'
          if (-not (Test-Path -LiteralPath $path)) {
            [IO.File]::WriteAllText($path, 'Guarded parity failed before a redacted assertion label was recorded.', (New-Object Text.UTF8Encoding($false)))
          }
      - name: Retain redacted native assertion label
        if: always() && steps.native_registry.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-backend-assertion
          path: ${{ runner.temp }}/ICloudNativeBackendAssertion.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify guarded Cloud Files hydration
        if: always() && steps.native_build.outcome == 'success'
        shell: powershell
        run: ./tests/Test-NativeCloudFiles.ps1 -Snapshot $env:ICLOUD_BACKEND_SNAPSHOT
      - name: Build Rust UI and verify fixture parity and package behavior
        if: always() && steps.native_build.outcome == 'success'
        shell: powershell
        run: |
          $backend = ./tools/Build-NativeBackend.ps1
          $build = ./tools/Build-RustUI.ps1 -Test
          ./tests/Test-RustUI.ps1 -WorkerPath $build.WorkerPath -BackendWorkerPath $backend.WorkerPath -RunNativeIntegration
          ./tests/Test-RustLaunchRouting.ps1
          $package = ./tools/New-RustUIPackage.ps1 -BuildInfo (Join-Path $build.Snapshot 'build-info.json') -BackendBuildInfo (Join-Path $backend.Snapshot 'build-info.json')
          ./tests/Test-RustUIPackage.ps1 -PackageDirectory $package.Directory -RunNativeIntegration
          ./tests/Test-RustUIHighContrast.ps1 -WorkerPath $build.WorkerPath
  native-rust-arm64:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.arm64_rust_only == true }}
    name: Native Rust checks (Windows ARM64)
    runs-on: windows-11-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Confirm native ARM64 Rust host
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $architecture = [System.Runtime.InteropServices.Architecture]::Arm64
          if ([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture -ne $architecture -or
              [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne $architecture) {
            throw 'This job must execute natively on Windows ARM64.'
          }
          $hostLine = rustc -vV | Where-Object { $_ -like 'host: *' }
          if ($LASTEXITCODE -ne 0 -or $hostLine -ne 'host: aarch64-pc-windows-msvc') {
            throw 'Rust must use the native aarch64-pc-windows-msvc host target.'
          }
          rustc --version
          cargo --version
      - name: Build and run native Rust unit suites
        id: rust_build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnosticPath = Join-Path $env:RUNNER_TEMP 'rust-arm64-failure.txt'
          $stage = 'backend build and unit tests'
          try {
            $backend = ./tools/Build-NativeBackend.ps1 -Test
            $stage = 'UI build and unit tests'
            $ui = ./tools/Build-RustUI.ps1 -Test
            $stage = 'visible Rust UI parity and guarded registry integration'
            ./tests/Test-RustUI.ps1 -WorkerPath $ui.WorkerPath -BackendWorkerPath $backend.WorkerPath -RunNativeIntegration -NoHiddenDesktop
            $stage = 'synthetic Cloud Files provider integration'
            ./tests/Test-NativeCloudFiles.ps1 -Snapshot $backend.Snapshot -NoHiddenDesktop
            $stage = 'preview package build and install/launch fixtures'
            $package = ./tools/New-RustUIPackage.ps1 -BuildInfo (Join-Path $ui.Snapshot 'build-info.json') -BackendBuildInfo (Join-Path $backend.Snapshot 'build-info.json')
            ./tests/Test-RustUIPackage.ps1 -PackageDirectory $package.Directory -RunNativeIntegration -NoHiddenDesktop
            $stage = 'backend formatting and Clippy'
            $env:CARGO_TARGET_DIR = Join-Path $backend.Snapshot 'target'
            $env:ICLOUD_FOLDER_MAP_PATH = Join-Path $backend.Snapshot 'folder-map.json'
            cargo fmt --manifest-path (Join-Path $backend.Snapshot 'Cargo.toml') -- --check
            if ($LASTEXITCODE) { throw 'ARM64 backend formatting check failed.' }
            cargo clippy --locked --manifest-path (Join-Path $backend.Snapshot 'Cargo.toml') --all-targets -- -D warnings
            if ($LASTEXITCODE) { throw 'ARM64 backend Clippy failed.' }
            $stage = 'UI formatting and Clippy'
            $env:CARGO_TARGET_DIR = Join-Path $ui.Snapshot 'target'
            $env:ICLOUD_FOLDER_MAP_PATH = Join-Path $ui.Snapshot 'folder-map.json'
            cargo fmt --manifest-path (Join-Path $ui.Snapshot 'Cargo.toml') -- --check
            if ($LASTEXITCODE) { throw 'ARM64 UI formatting check failed.' }
            cargo clippy --locked --manifest-path (Join-Path $ui.Snapshot 'Cargo.toml') --all-targets -- -D warnings
            if ($LASTEXITCODE) { throw 'ARM64 UI Clippy failed.' }
            $stage = 'ARM64 PE architecture and worker protocol'
            function Assert-Arm64Pe([string]$Path) {
              $stream = [IO.File]::OpenRead($Path)
              try {
                $reader = New-Object IO.BinaryReader($stream)
                $stream.Position = 0x3c
                $peOffset = $reader.ReadInt32()
                $stream.Position = $peOffset
                if ($reader.ReadUInt32() -ne 0x00004550 -or $reader.ReadUInt16() -ne 0xAA64) {
                  throw 'A Rust release executable is not a valid ARM64 PE.'
                }
              } finally { $stream.Dispose() }
            }
            Assert-Arm64Pe $backend.WorkerPath
            Assert-Arm64Pe $ui.WorkerPath
            $records = @('{"version":1,"operation":"metadata"}' | & $backend.WorkerPath | ForEach-Object { $_ | ConvertFrom-Json })
            if ($LASTEXITCODE -ne 0 -or $records.Count -lt 2 -or $records[0].type -ne 'metadata' -or
                $records[0].mappings.Count -ne 13 -or $records[-1].type -ne 'result' -or $records[-1].ok -ne $true) {
              throw 'The native ARM64 worker metadata protocol check failed.'
            }
            Write-Output 'PASS: native ARM64 backend/UI unit suites, release PE architecture and read-only worker protocol.'
          } catch {
            $detail = "Failed stage: $stage`nMessage: $($_.Exception.Message)`nScript: $($_.ScriptStackTrace)"
            [IO.File]::WriteAllText($diagnosticPath, $detail, (New-Object Text.UTF8Encoding($false)))
            [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "### ARM64 Rust diagnostic`n````text`n$detail`n`````n", (New-Object Text.UTF8Encoding($false)))
            throw
          }
      - name: Retain ARM64 Rust failure summary
        if: always() && steps.rust_build.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-arm64-failure-summary
          path: ${{ runner.temp }}/rust-arm64-failure.txt
          if-no-files-found: warn
          retention-days: 3
  native-rust-x64-preview:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rust_preview_x64_only == true }}
    name: Rust x64 preview package install and launch
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Confirm hosted native x64 Rust host
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $architecture = [System.Runtime.InteropServices.Architecture]::X64
          if ([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture -ne $architecture -or
              [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne $architecture) {
            throw 'This job must execute natively on Windows x64.'
          }
          $hostLine = rustc -vV | Where-Object { $_ -like 'host: *' }
          if ($LASTEXITCODE -ne 0 -or $hostLine -ne 'host: x86_64-pc-windows-msvc') {
            throw 'Rust must use the native x86_64-pc-windows-msvc host target.'
          }
          if ((./tests/Assert-IsolatedEnvironment.ps1) -ne 'GitHubHosted') {
            throw 'This install and launch fixture requires an isolated GitHub-hosted runner.'
          }
          rustc --version
          cargo --version
      - name: Build, install and verify the x64 Rust preview package
        id: rust_x64_validation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnosticPath = Join-Path $env:RUNNER_TEMP 'rust-x64-failure.txt'
          $stage = 'backend build and unit tests'
          try {
            $backend = ./tools/Build-NativeBackend.ps1 -Test
            $stage = 'UI build and unit tests'
            $ui = ./tools/Build-RustUI.ps1 -Test
            $stage = 'visible Rust UI parity and guarded registry integration'
            ./tests/Test-RustUI.ps1 -WorkerPath $ui.WorkerPath -BackendWorkerPath $backend.WorkerPath -RunNativeIntegration -NoHiddenDesktop
            $stage = 'synthetic Cloud Files provider integration'
            ./tests/Test-NativeCloudFiles.ps1 -Snapshot $backend.Snapshot -NoHiddenDesktop
            $stage = 'preview package build and install/launch/tamper fixtures'
            $package = ./tools/New-RustUIPackage.ps1 -BuildInfo (Join-Path $ui.Snapshot 'build-info.json') -BackendBuildInfo (Join-Path $backend.Snapshot 'build-info.json')
            ./tests/Test-RustUIPackage.ps1 -PackageDirectory $package.Directory -RunNativeIntegration -NoHiddenDesktop
            $stage = 'backend formatting and Clippy'
            $env:CARGO_TARGET_DIR = Join-Path $backend.Snapshot 'target'
            $env:ICLOUD_FOLDER_MAP_PATH = Join-Path $backend.Snapshot 'folder-map.json'
            cargo fmt --manifest-path (Join-Path $backend.Snapshot 'Cargo.toml') -- --check
            if ($LASTEXITCODE) { throw 'x64 backend formatting check failed.' }
            cargo clippy --locked --manifest-path (Join-Path $backend.Snapshot 'Cargo.toml') --all-targets -- -D warnings
            if ($LASTEXITCODE) { throw 'x64 backend Clippy failed.' }
            $stage = 'UI formatting and Clippy'
            $env:CARGO_TARGET_DIR = Join-Path $ui.Snapshot 'target'
            $env:ICLOUD_FOLDER_MAP_PATH = Join-Path $ui.Snapshot 'folder-map.json'
            cargo fmt --manifest-path (Join-Path $ui.Snapshot 'Cargo.toml') -- --check
            if ($LASTEXITCODE) { throw 'x64 UI formatting check failed.' }
            cargo clippy --locked --manifest-path (Join-Path $ui.Snapshot 'Cargo.toml') --all-targets -- -D warnings
            if ($LASTEXITCODE) { throw 'x64 UI Clippy failed.' }
            $stage = 'x64 PE architecture and worker protocol'
            function Assert-X64Pe([string]$Path) {
              $stream = [IO.File]::OpenRead($Path)
              try {
                $reader = New-Object IO.BinaryReader($stream)
                $stream.Position = 0x3c
                $peOffset = $reader.ReadInt32()
                $stream.Position = $peOffset
                if ($reader.ReadUInt32() -ne 0x00004550 -or $reader.ReadUInt16() -ne 0x8664) {
                  throw "A Rust release executable is not a valid x64 PE: $Path"
                }
              } finally { $stream.Dispose() }
            }
            Assert-X64Pe $backend.WorkerPath
            Assert-X64Pe $ui.WorkerPath
            $records = @('{"version":1,"operation":"metadata"}' | & $backend.WorkerPath | ForEach-Object { $_ | ConvertFrom-Json })
            if ($LASTEXITCODE -ne 0 -or $records.Count -lt 2 -or $records[0].type -ne 'metadata' -or
                $records[0].mappings.Count -ne 13 -or $records[-1].type -ne 'result' -or $records[-1].ok -ne $true) {
              throw 'The native x64 worker metadata protocol check failed.'
            }
            Write-Output 'PASS: x64 backend/UI unit suites, visible preview install/launch fixture, package integrity, PE architecture and read-only worker protocol.'
          } catch {
            $detail = "Failed stage: $stage`nMessage: $($_.Exception.Message)`nScript: $($_.ScriptStackTrace)"
            [IO.File]::WriteAllText($diagnosticPath, $detail, (New-Object Text.UTF8Encoding($false)))
            [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "### x64 Rust diagnostic`n````text`n$detail`n`````n", (New-Object Text.UTF8Encoding($false)))
            throw
          }
      - name: Retain x64 Rust failure summary
        if: always() && steps.rust_x64_validation.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-x64-failure-summary
          path: ${{ runner.temp }}/rust-x64-failure.txt
          if-no-files-found: warn
          retention-days: 3
  native-ui:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.arm64_rust_only != true && inputs.rust_preview_x64_only != true) }}
    name: Native WinUI build and hidden-desktop fixtures
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Build locked native x64 source
        id: native_build
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build ./ui/ICloudFolderSetup/ICloudFolderSetup.csproj -c Debug -p:Platform=x64 -p:RestoreLockedMode=true
          if ($LASTEXITCODE) { throw 'Native Debug build failed.' }
          dotnet build ./ui/ICloudFolderSetup/ICloudFolderSetup.csproj -c Release -p:Platform=x64 -p:RestoreLockedMode=true
          if ($LASTEXITCODE) { throw 'Native Release build failed.' }
      - name: Exercise native UI behavior, theme, layout and accessibility
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tests/Test-WinUI.ps1
          & ./tests/Test-WinUITheme.ps1
          & ./tests/Test-WinUILayout.ps1
          & ./tests/Test-WinUIAccessibility.ps1
      - name: Verify real high-contrast settings in disposable hosted Windows
        if: ${{ always() && steps.native_build.outcome == 'success' }}
        run: ./tests/Test-WinUIHighContrast.ps1
      - name: Verify owned native folder, backup and save pickers
        if: ${{ always() && steps.native_build.outcome == 'success' }}
        run: ./tests/Test-WinUIPickers.ps1
      - name: Cross-build native ARM64 source
        if: ${{ always() && steps.native_build.outcome == 'success' }}
        run: |
          dotnet build ./ui/ICloudFolderSetup/ICloudFolderSetup.csproj -c Release -p:Platform=ARM64 -r win-arm64 -p:RestoreLockedMode=true
          if ($LASTEXITCODE) { throw 'Native ARM64 cross-build failed.' }
      - name: Retain native fixture evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-ui-fixtures
          path: .local/hidden-desktop/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
  package:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.arm64_rust_only != true && inputs.rust_preview_x64_only != true) }}
    name: Package verification
    needs: [unit, integration, native-ui]
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Build and verify immutable source package
        shell: powershell
        run: |
          $package = ./tools/New-ReleasePackage.ps1
          ./tools/Test-ReleasePackage.ps1 -Archive $package.Archive
          ./tests/Test-NativePackage.ps1 -Archive $package.Archive
          ./tests/Test-ReleaseTools.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-package
          path: |
            .local/packages/v*/*.zip
            .local/packages/v*/SHA256SUMS.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
