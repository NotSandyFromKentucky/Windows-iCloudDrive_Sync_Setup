name: Versioned release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Build, verify remote assets and publish
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = ./tools/New-ReleasePackage.ps1
          ./tools/Test-ReleasePackage.ps1 -Archive $package.Archive
          ./tools/Publish-Release.ps1 -Archive $package.Archive -Repository $env:GITHUB_REPOSITORY
